[project]
name = "cloudguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KunleAdesanmi", email = "96393713+KunleAdesanmi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.9",
]

[project.scripts]
cloudguard = "cloudguard:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
